name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install lightweight runtime dependencies
        run: |
          python -m pip install pandas pyarrow streamlit plotly requests pyspark

      - name: Install project package
        run: |
          python -m pip install -e .

      - name: Compile Python source files
        run: |
          python -m compileall src scripts app

      - name: Import package modules
        run: |
          python -c "import cyber_risk; print('cyber_risk package import OK')"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install test dependencies
        run: |
          python -m pip install pytest scikit-learn pandas

      # remediation_copilot.py imports duckdb at module level. The unit
      # tests only exercise the pure decision-logic functions (urgency
      # classification, SLA lookup, action lists, retrieval ranking), so
      # a full duckdb install isn't needed just to import the module for
      # testing -- but installing it here keeps the test job identical to
      # a real dev environment instead of relying on import-time stubs.
      - name: Install runtime dependencies used by the module under test
        run: |
          python -m pip install duckdb

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v
