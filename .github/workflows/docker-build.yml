name: Docker Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cyber-risk-intelligence-api:ci .

      - name: Start container
        run: docker run -d --name ci-smoke -p 8000:8000 cyber-risk-intelligence-api:ci

      - name: Check liveness
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/livez; then
              exit 0
            fi
            sleep 2
          done
          docker logs ci-smoke
          exit 1

      - name: Confirm readiness fails without artifacts
        run: |
          status=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:8000/readyz)
          test "$status" = "503"
          cat /tmp/ready.json

      - name: Stop container
        if: always()
        run: docker rm -f ci-smoke || true
