[project]
name = "cyber-risk-intelligence-lakehouse"
version = "0.2.0"
description = "Cyber risk data pipeline with PySpark, dbt, FastAPI, model evaluation, and retrieval-assisted remediation guidance."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
